<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้าสินค้า — MetaStore</title>
  
  <!-- Fonts: Roboto Flex & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=Roboto+Flex:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="home.css">
</head>
<body class="store-body">

  <!-- Studio Background Layer (100% Identical to index.html — Dot Grid + Ambient Red Glow, Zero Starfall) -->
  <div class="studio-background-layer" aria-hidden="true">
    <div class="studio-grid-dots"></div>
    <div class="studio-mockup-glow glow-center"></div>
    <div class="studio-mockup-glow glow-bottom"></div>
  </div>

  <div class="site-wrapper">

    <!-- 2. Floating Pill Navbar (100% Identical to home.html & index.html) -->
    <div class="navbar-dock-container">
      <nav class="navbar-pill">
        
        <!-- Brand Logo + Name -->
        <a href="index.html" class="nav-brand-group">
          <img src="logo.png" onerror="this.onerror=null; this.src='logo.png';" alt="Meta Logo" class="nav-brand-logo store-dynamic-logo">
          <span class="nav-brand-title" id="navbarBrandName">MetaStore</span>
        </a>

        <!-- Menu Links (100% identical to home.html & index.html: ร้านค้าสินค้า, เติมเงิน & คู่มือการใช้งาน) -->
        <div class="nav-menu-links">
          <a href="store.html" class="nav-item-link active" data-i18n="navStore">ร้านค้าสินค้า</a>
          <a href="topup.html" class="nav-item-link" data-i18n="navTopup">เติมเงิน</a>
          <a href="home.html#howToModal" onclick="window.location.href='home.html'; return false;" class="nav-item-link" data-i18n="navDocs">คู่มือการใช้งาน</a>
        </div>

        <!-- Actions & Language Switcher -->
        <div class="nav-actions-group">
          <!-- Multi-language Pill: TH / EN / PT -->
          <div class="nav-lang-segment">
            <button type="button" class="nav-lang-btn active" id="btnLangTH" onclick="setStoreLanguage('th')">TH</button>
            <button type="button" class="nav-lang-btn" id="btnLangEN" onclick="setStoreLanguage('en')">EN</button>
            <button type="button" class="nav-lang-btn" id="btnLangPT" onclick="setStoreLanguage('pt')">PT</button>
          </div>

          <!-- Guest Auth Actions (Exact index.html / home.html buttons when logged out) -->
          <div id="navGuestGroup" style="display: none; align-items: center; gap: 10px;">
            <button type="button" class="btn-nav-ghost" onclick="window.location.href='home.html#login'" data-i18n="btnLogin">เข้าสู่ระบบ</button>
            <button type="button" class="btn-nav-cta" onclick="window.location.href='home.html#register'" data-i18n="btnRegister">สมัครสมาชิก</button>
          </div>

          <!-- Coin Balance Pill -->
          <div class="coin-balance-pill" id="navCoinPill" onclick="window.location.href='topup.html'" title="เติมเงิน COIN" style="cursor: pointer;">
            <div class="coin-icon">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
            </div>
            <span class="coin-amount" id="coinBalanceDisplay">0.00</span>
            <span class="coin-unit">COIN</span>
          </div>

          <!-- User Menu Dropdown (Clean, Zero Emojis) -->
          <div class="user-menu-wrapper" id="navUserGroup" style="display: none;">
            <button type="button" class="user-avatar-btn" onclick="toggleUserDropdown()" aria-label="User Menu">
              <img src="logo.png" onerror="this.onerror=null; this.src='logo.png';" alt="Profile" class="store-dynamic-logo">
            </button>

            <!-- Dropdown Card -->
            <div class="user-dropdown-card" id="userDropdownCard">
              <div class="dropdown-user-info">
                <div class="dropdown-user-name" id="dropdownUserName">meta_customer</div>
                <div class="dropdown-user-role" id="dropdownUserRole">VIP Member</div>
              </div>

              <div style="padding: 8px 12px; background: rgba(0,0,0,0.3); border-radius: 8px; margin: 6px 0; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.78rem; color: var(--text-muted);" data-i18n="lblBalance">ยอดเงินคงเหลือ:</span>
                <span style="font-family: var(--font-en); font-weight: 800; color: #fef08a; font-size: 0.88rem;" id="dropdownCoinDisplay">0.00 ฿</span>
              </div>

              <a href="topup.html" class="dropdown-link">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span data-i18n="menuWallet">เติมเงิน COIN</span>
              </a>
              <a href="home.html" class="dropdown-link">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span data-i18n="navStore">หน้าร้านค้า</span>
              </a>
              <a href="admin.html" class="dropdown-link admin-btn" id="dropdownAdminLink" style="display: none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span data-i18n="menuAdmin">จัดการหลังบ้าน (Admin)</span>
              </a>
              <div style="height: 1px; background: var(--border-glass); margin: 4px 0;"></div>
              <a href="javascript:void(0)" onclick="handleUserLogout()" class="dropdown-link logout">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span data-i18n="menuLogout">ออกจากระบบ</span>
              </a>
            </div>
          </div>
        </div>

      </nav>
    </div>

    <!-- Subpage Main Content (Matching Image 3: media_1791190786458.png) -->
    <main class="store-subpage-container">
      
      <!-- Filter Toolbar: Category Tabs + Search + Sort -->
      <div class="store-filter-toolbar">
        <!-- Category Tabs -->
        <div class="store-category-tabs" id="storeCategoryTabsContainer">
          <!-- Dynamically populated category buttons -->
        </div>

        <!-- Search & Sort Controls -->
        <div class="store-search-sort-group">
          <div class="store-search-input-wrap">
            <svg class="store-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="storeSearchInput" class="store-search-field" placeholder="ค้นหาชื่อสินค้า..." oninput="handleSearchChange()">
          </div>

          <select id="storeSortSelect" class="store-sort-select" onchange="handleSortChange()">
            <option value="latest">เรียงตาม: ล่าสุด</option>
            <option value="price_asc">ราคา: ต่ำไปสูง</option>
            <option value="price_desc">ราคา: สูงไปต่ำ</option>
            <option value="popular">ยอดนิยม</option>
          </select>
        </div>
      </div>

      <!-- Filtered Products Grid -->
      <div class="products-cards-grid" id="storeProductsGrid">
        <!-- Product Cards Dynamically Injected -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="store-footer">
      <div class="footer-container">
        <p class="footer-copy-text">
          © 2026 <span id="footerBrandName">MetaStore</span>. All Rights Reserved. แพลตฟอร์มโปรแกรมช่วยเล่นอันดับ 1 ของเมืองไทย
        </p>
      </div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div class="store-toast" id="storeToast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff1111" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span id="storeToastMsg">ข้อความแจ้งเตือน</span>
  </div>

  <script src="store-assets.js"></script>
  <script src="store-data.js"></script>
  <script src="page-transitions.js"></script>
  <script>
    // Store Subpage Controller
    let currentStoreLang = localStorage.getItem('meta_lang') || 'th';
    let activeSubCategory = null; // null = 'all'
    let currentSearchTerm = '';
    let currentSortOrder = 'latest';

    const storeI18n = {
      th: {
        pageTitle: "ร้านค้าสินค้า — MetaStore",
        navHome: "หน้าหลัก",
        navStore: "สินค้าทั้งหมด",
        navTopup: "เติมเงิน",
        navContact: "ติดต่อเรา",
        btnLogin: "เข้าสู่ระบบ",
        menuLogout: "ออกจากระบบ",
        tabAll: "ทั้งหมด",
        searchPlaceholder: "ค้นหาชื่อสินค้า...",
        sortLatest: "เรียงตาม: ล่าสุด",
        sortPriceAsc: "ราคา: ต่ำไปสูง",
        sortPriceDesc: "ราคา: สูงไปต่ำ",
        sortPopular: "ยอดนิยม",
        btnBuyNow: "ซื้อเลย",
        outOfStock: "สินค้าหมด",
        inStockPrefix: "มีสินค้า",
        itemsUnit: "ชิ้น",
        noProductsFound: "ไม่พบสินค้าที่ตรงกับการค้นหา"
      },
      en: {
        pageTitle: "All Products — MetaStore",
        navHome: "Home",
        navStore: "Products",
        navTopup: "Top Up",
        navContact: "Contact",
        btnLogin: "Sign In",
        menuLogout: "Sign Out",
        tabAll: "All",
        searchPlaceholder: "Search products...",
        sortLatest: "Sort: Latest",
        sortPriceAsc: "Price: Low to High",
        sortPriceDesc: "Price: High to Low",
        sortPopular: "Popular",
        btnBuyNow: "Buy Now",
        outOfStock: "Out of Stock",
        inStockPrefix: "In Stock",
        itemsUnit: "units",
        noProductsFound: "No products found"
      },
      pt: {
        pageTitle: "Todos os Produtos — MetaStore",
        navHome: "Início",
        navStore: "Produtos",
        navTopup: "Recarregar",
        navContact: "Contato",
        btnLogin: "Entrar",
        menuLogout: "Sair",
        tabAll: "Todos",
        searchPlaceholder: "Buscar produtos...",
        sortLatest: "Ordenar: Mais Recentes",
        sortPriceAsc: "Preço: Menor ao Maior",
        sortPriceDesc: "Preço: Maior ao Menor",
        sortPopular: "Populares",
        btnBuyNow: "Comprar",
        outOfStock: "Esgotado",
        inStockPrefix: "Em Estoque",
        itemsUnit: "unidades",
        noProductsFound: "Nenhum produto encontrado"
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      StoreDB.applyTheme();
      initStorePage();
      setStoreLanguage(currentStoreLang);
    });

    function initStorePage() {
      const settings = StoreDB.getSettings();
      const user = StoreDB.getUser();

      const brandEl = document.getElementById('navbarBrandName');
      if (brandEl) brandEl.textContent = settings.storeName || "MetaStore";
      const footerEl = document.getElementById('footerBrandName');
      if (footerEl) footerEl.textContent = settings.storeName || "MetaStore";

      updateNavUser(user);

      // Check URL Query Param ?c= or ?cat= (e.g. ?c=ad or ?c=cat_ff_ad)
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('c') || urlParams.get('cat');
      if (catParam) {
        const categories = StoreDB.getCategories();
        const matched = categories.find(c => c.slug === catParam || c.id === catParam || (c.slug && c.slug.toLowerCase() === catParam.toLowerCase()));
        if (matched) {
          activeSubCategory = matched.id;
        }
      }

      renderCategoryTabs();
      renderFilteredProducts();
    }

    function renderCategoryTabs() {
      const container = document.getElementById('storeCategoryTabsContainer');
      if (!container) return;

      const categories = StoreDB.getCategories();
      const products = StoreDB.getProducts();
      const dict = storeI18n[currentStoreLang] || storeI18n.th;

      const totalCount = products.length;
      const isAllActive = activeSubCategory === null;

      let html = `
        <button type="button" class="store-cat-tab-btn ${isAllActive ? 'active' : ''}" onclick="selectSubCategory(null)">
          <span>${dict.tabAll}</span>
          <span style="opacity: 0.8; font-weight: 500;">(${totalCount})</span>
        </button>
      `;

      categories.forEach(cat => {
        const catCount = products.filter(p => p.categoryId === cat.id).length;
        const isActive = activeSubCategory === cat.id;

        html += `
          <button type="button" class="store-cat-tab-btn ${isActive ? 'active' : ''}" onclick="selectSubCategory('${cat.id}')">
            <span>${cat.name}</span>
            <span style="opacity: 0.8; font-weight: 500;">(${catCount})</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function selectSubCategory(catId) {
      activeSubCategory = catId;
      
      // Update URL without full page reload
      const url = new URL(window.location);
      if (catId) {
        const cat = StoreDB.getCategories().find(c => c.id === catId);
        url.searchParams.set('c', cat ? cat.slug : catId);
      } else {
        url.searchParams.delete('c');
        url.searchParams.delete('cat');
      }
      window.history.pushState({}, '', url);

      renderCategoryTabs();
      renderFilteredProducts();
    }

    function handleSearchChange() {
      currentSearchTerm = document.getElementById('storeSearchInput').value.trim().toLowerCase();
      renderFilteredProducts();
    }

    function handleSortChange() {
      currentSortOrder = document.getElementById('storeSortSelect').value;
      renderFilteredProducts();
    }

    function renderFilteredProducts() {
      const grid = document.getElementById('storeProductsGrid');
      if (!grid) return;

      let products = StoreDB.getProducts();
      const dict = storeI18n[currentStoreLang] || storeI18n.th;

      // Filter by category
      if (activeSubCategory) {
        products = products.filter(p => p.categoryId === activeSubCategory);
      }

      // Filter by search query
      if (currentSearchTerm) {
        products = products.filter(p => 
          p.name.toLowerCase().includes(currentSearchTerm) || 
          (p.description && p.description.toLowerCase().includes(currentSearchTerm))
        );
      }

      // Sort
      if (currentSortOrder === 'price_asc') {
        products.sort((a, b) => a.priceMin - b.priceMin);
      } else if (currentSortOrder === 'price_desc') {
        products.sort((a, b) => b.priceMin - a.priceMin);
      } else if (currentSortOrder === 'popular') {
        products.sort((a, b) => (parseInt(b.badge) || 0) - (parseInt(a.badge) || 0));
      }

      if (products.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 0.95rem;">
            ${dict.noProductsFound}
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map((prod, idx) => {
        const isOutOfStock = prod.stock <= 0 || prod.status === 'out_of_stock';
        const priceDisplay = StoreDB.formatPriceRange(prod.priceMin, prod.priceMax);

        return `
          <a href="product.html?id=${encodeURIComponent(prod.id)}" class="product-card ${isOutOfStock ? 'out-of-stock' : ''} card-swap-animate" style="animation-delay: ${idx * 0.04}s;">
            <div class="card-thumb-wrap">
              <img src="${prod.imageUrl || 'logo.png'}" onerror="this.onerror=null; this.src='logo.png';" alt="${prod.name}" class="card-thumb-img">
            </div>

            <div class="card-body-meta">
              <div>
                <h4 class="card-prod-title" title="${prod.name}">${prod.name}</h4>
                <div class="card-price-row">
                  <span class="card-price-value">${priceDisplay}</span>
                </div>
                <div class="card-stock-status">
                  <span class="stock-indicator-dot ${isOutOfStock ? 'out' : ''}"></span>
                  <span>${isOutOfStock ? dict.outOfStock : `${dict.inStockPrefix} ${prod.stock} ${dict.itemsUnit}`}</span>
                </div>
              </div>

              <div class="btn-card-buy ${isOutOfStock ? 'disabled' : ''}">
                ${isOutOfStock 
                  ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>' 
                  : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>'}
                <span>${isOutOfStock ? dict.outOfStock : dict.btnBuyNow}</span>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    function goToProduct(productId) {
      window.location.href = 'product.html?id=' + encodeURIComponent(productId);
    }

    function updateNavUser(user) {
      const guestGroup = document.getElementById('navGuestGroup');
      const userGroup = document.getElementById('navUserGroup');
      const coinPill = document.getElementById('navCoinPill');
      const coinText = document.getElementById('coinBalanceDisplay');
      const userName = document.getElementById('navUserName');
      const adminLink = document.getElementById('dropdownAdminLink');

      if (user && user.isLoggedIn) {
        if (guestGroup) guestGroup.style.display = 'none';
        if (userGroup) userGroup.style.display = 'block';
        if (coinPill) coinPill.style.display = 'flex';
        if (coinText) coinText.textContent = `${StoreDB.formatPrice(user.balance || 0).replace('฿', '')} ฿`;
        if (userName) userName.textContent = user.username || 'meta_user';
        if (adminLink) adminLink.style.display = StoreDB.isAdmin() ? 'flex' : 'none';
      } else {
        if (guestGroup) guestGroup.style.display = 'inline-flex';
        if (userGroup) userGroup.style.display = 'none';
        if (coinPill) coinPill.style.display = 'none';
        if (adminLink) adminLink.style.display = 'none';
      }
    }

    function toggleUserDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById('userDropdownMenu');
      if (menu) menu.classList.toggle('active');
    }

    document.addEventListener('click', () => {
      const menu = document.getElementById('userDropdownMenu');
      if (menu) menu.classList.remove('active');
    });

    function handleUserLogout() {
      StoreDB.logoutUser();
      window.location.reload();
    }

    function setStoreLanguage(lang) {
      currentStoreLang = lang;
      localStorage.setItem('meta_lang', lang);

      ['th', 'en', 'pt'].forEach(l => {
        const btn = document.getElementById('btnLang' + l.toUpperCase());
        if (btn) btn.classList.toggle('active', l === lang);
      });

      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
      const dict = storeI18n[lang] || storeI18n.th;
      document.title = dict.pageTitle;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });

      renderCategoryTabs();
      renderFilteredProducts();
    }
  </script>
</body>
</html>
